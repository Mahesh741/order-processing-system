name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (embedded Kafka, H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  test-postgres:
    name: Tests (embedded Kafka, PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orders
          POSTGRES_USER: orders
          POSTGRES_PASSWORD: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orders -d orders"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/orders
      TEST_DB_USER: orders
      TEST_DB_PASSWORD: orders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
